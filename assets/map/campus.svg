<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef6ec"/>
      <stop offset="1" stop-color="#e3f0e0"/>
    </linearGradient>
    <pattern id="stone" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#e8e4de"/>
      <rect x="0" y="0" width="19" height="19" fill="#d9d5cf" rx="1"/>
      <rect x="21" y="0" width="19" height="19" fill="#ddd9d3" rx="1"/>
      <rect x="10" y="21" width="19" height="19" fill="#ddd9d3" rx="1"/>
      <rect x="31" y="21" width="9" height="19" fill="#d9d5cf" rx="1"/>
      <rect x="0" y="21" width="8" height="19" fill="#d9d5cf" rx="1"/>
    </pattern>
  </defs>

  <!-- Ground -->
  <rect width="1000" height="700" fill="url(#grass)" rx="10"/>

  <!-- Stone pathways -->
  <path d="M0,380 Q200,350 350,380 Q500,420 650,380 Q800,340 1000,380" fill="url(#stone)" opacity="0.7" stroke="none"/>
  <path d="M0,420 Q200,450 350,420 Q500,380 650,420 Q800,460 1000,420" fill="url(#stone)" opacity="0.6" stroke="none"/>
  <rect x="350" y="300" width="300" height="120" fill="url(#stone)" opacity="0.5" rx="8"/>

  <!-- Central roundabout / garden circle -->
  <circle cx="500" cy="400" r="55" fill="#c9b896" stroke="#a89878" stroke-width="2"/>
  <circle cx="500" cy="400" r="40" fill="#b8a882"/>
  <circle cx="500" cy="400" r="25" fill="#a09070"/>
  <circle cx="500" cy="400" r="12" fill="#8a7a60"/>

  <!-- Trees scattered -->
  <g fill="#6aaa5a" opacity="0.8">
    <circle cx="80" cy="80" r="18"/><circle cx="150" cy="55" r="14"/>
    <circle cx="920" cy="70" r="16"/><circle cx="950" cy="140" r="12"/>
    <circle cx="60" cy="560" r="15"/><circle cx="140" cy="600" r="12"/>
    <circle cx="940" cy="550" r="14"/><circle cx="960" cy="630" r="11"/>
    <circle cx="440" cy="140" r="10"/><circle cx="600" cy="140" r="10"/>
    <circle cx="300" cy="580" r="10"/><circle cx="420" cy="620" r="9"/>
    <circle cx="700" cy="600" r="10"/><circle cx="850" cy="640" r="9"/>
  </g>

  <!-- Title -->
  <text x="500" y="690" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b" opacity="0.7">
    CCSJDM Campus — City College of San Jose Del Monte
  </text>
</svg>
