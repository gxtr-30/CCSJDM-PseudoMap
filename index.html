<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CCSJDM Campus Navigator — locate rooms, offices, buildings, and facilities at the City College of San Jose Del Monte.">
  <meta name="theme-color" content="#1d4ed8">
  <title>CCSJDM Campus Navigator</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>

  <!-- Top bar: brand + search + theme toggle -->
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#" id="brand-home">
        <span class="brand-logo">CC</span>
        <span class="brand-text"><strong>CCSJDM</strong><span>Campus Navigator</span></span>
      </a>
      <div class="search-wrap">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Search room, office, building…">
          <button class="search-clear" id="search-clear" type="button" hidden>&times;</button>
        </div>
        <div class="suggestions" id="suggestions" role="listbox" hidden></div>
      </div>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <span class="theme-light">☽</span>
        <span class="theme-dark">☀</span>
      </button>
    </div>
  </header>

  <!-- Category chips — highlight only, no auto-popup -->
  <nav class="chips" id="chips" aria-label="Browse by category"></nav>

  <!-- Campus map — photo background with SVG building overlays -->
  <main class="map-wrap" id="map-wrap">
    <div class="map-box" id="map-box">
      <div class="map-scroll" id="map-scroll">
        <!-- Photo background -->
        <img src="assets/map/campus-bg.svg" class="map-photo" id="map-photo" alt="CCSJDM Campus Map" draggable="false">
        <!-- SVG overlay for clickable buildings -->
        <svg id="map-svg" class="map-svg" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="map-controls">
        <button class="map-btn" id="zoom-in" aria-label="Zoom in">+</button>
        <button class="map-btn" id="zoom-out" aria-label="Zoom out">−</button>
        <button class="map-btn map-btn-reset" id="map-reset" aria-label="Reset" hidden>⟲</button>
      </div>
      <div class="map-status" id="map-status" hidden></div>
    </div>
  </main>

  <!-- Popup overlay -->
  <div class="popup-overlay" id="popup-overlay" hidden>
    <div class="popup" id="popup">
      <button class="popup-close" id="popup-close" type="button" aria-label="Close">&times;</button>
      <div class="popup-body" id="popup-body"></div>
    </div>
  </div>

  <noscript><div style="padding:2rem;text-align:center">This app requires JavaScript.</div></noscript>

  <script src="js/data.js"></script>
  <script src="js/search.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
